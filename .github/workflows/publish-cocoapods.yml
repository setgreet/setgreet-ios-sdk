name: Publish CocoaPods

# LEGACY, manual only. CocoaPods Trunk stopped accepting new podspecs during its
# read-only trial week (until Friday 2026-11-06 12:00 ET) and becomes permanently
# read-only on 2026-12-02, so a release no longer publishes to Trunk. Install
# paths that need nothing from Trunk:
#   - Swift Package Manager (Package.swift in this repo, binary targets).
#   - CocoaPods by podspec URL from this repo (see README "CocoaPods"), e.g.
#     pod 'SetgreetSDK', :podspec => 'https://raw.githubusercontent.com/setgreet/setgreet-ios-sdk/<version>/SetgreetSDK.podspec'
#   - The React Native and Flutter wrappers vendor the XCFrameworks and ship a
#     Package.swift of their own, so they do not depend on the SetgreetSDK pod.
#
# The tag trigger was removed: setgreet-ios's release workflow still commits the
# XCFrameworks + bumped podspecs here and pushes the version tag, but that tag
# starts nothing. This workflow stays only for a courtesy publish of a release
# while Trunk still accepts pushes (for example 1.11.0 after 2026-11-06): run it
# by hand from the Actions tab AGAINST THE VERSION TAG. The body is unchanged.
#
# Runs HERE, in the public distribution repo, because GitHub-hosted runners are
# free for public repositories. `pod trunk push` lints each podspec by building
# against it on macOS: ~14 minutes a release.
#
# The token can publish new versions of the SDK every customer installs, so it
# is NOT a repository secret: it lives in the `cocoapods` GitHub Environment,
# whose deployment policy admits only version tags ([0-9]*.[0-9]*.[0-9]*). A run
# from any branch (a dispatch on a branch, or a workflow edited on a branch)
# cannot read it, and fork PRs never trigger this workflow at all.
#
# Setup: Settings -> Environments -> cocoapods -> add secret COCOAPODS_TRUNK_TOKEN.

on:
  # Manual only: choose the version tag as the ref when running it (a run from
  # a branch is refused by the environment's tag-only policy).
  workflow_dispatch:

concurrency:
  group: cocoapods-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 45
    environment: cocoapods
    steps:
      # Pinned to a commit: the only third-party code in a job holding the
      # trunk token, so a re-pointed tag cannot run new code next to it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Verify podspec versions match the tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          for spec in SetgreetSDK.podspec SetgreetSDKLottie.podspec; do
            grep -q "spec.version      = \"${VERSION}\"" "$spec" \
              || { echo "::error::$spec version does not match tag ${VERSION}"; exit 1; }
          done

      # `pod trunk push` lints SetgreetSDKLottie by building it against the
      # newest lottie-ios its `~> 4.6` constraint allows, inside the step that
      # holds the trunk token. Only publish against a lottie-ios version someone
      # has looked at: when a newer one appears, review it, then raise
      # REVIEWED_LOTTIE_VERSION. Runs before the token is in the environment.
      - name: Check lottie-ios resolves to the reviewed version
        env:
          REVIEWED_LOTTIE_VERSION: "4.6.1"
        run: |
          shard=$(printf lottie-ios | md5 | cut -c1-3 | sed 's/./&_/g; s/_$//')
          versions=$(curl -fsS "https://cdn.cocoapods.org/all_pods_versions_${shard}.txt" \
            | grep '^lottie-ios/' | tr '/' '\n' | tail -n +2)
          resolved=$(echo "$versions" | grep -E '^4\.([6-9]|[1-9][0-9])\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$resolved" ]; then
            echo "::error::Could not read lottie-ios versions from the CocoaPods CDN"
            exit 1
          fi
          if [ "$resolved" != "$REVIEWED_LOTTIE_VERSION" ]; then
            echo "::error::lottie-ios resolves to ${resolved}, reviewed version is ${REVIEWED_LOTTIE_VERSION}. Review it, update REVIEWED_LOTTIE_VERSION, then rerun on the tag."
            exit 1
          fi
          echo "lottie-ios resolves to the reviewed ${resolved}"

      # Idempotent, so a retry ("Run workflow" on the tag) finishes a half-done
      # publish: a pod version already on trunk is skipped rather than failing
      # the run as a duplicate before the companion gets its turn.
      - name: Push CocoaPods
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN is not set in the cocoapods environment of setgreet-ios-sdk"
            exit 1
          fi
          published() { pod trunk info "$1" 2>/dev/null | grep -q -- "- ${VERSION} "; }

          # Core must publish first: the companion declares an exact-version
          # dependency on SetgreetSDK, and `pod trunk push` validates that the
          # dependency is resolvable on trunk before accepting the companion.
          if published SetgreetSDK; then
            echo "SetgreetSDK ${VERSION} already on trunk, skipping"
          else
            pod trunk push SetgreetSDK.podspec --allow-warnings
          fi
          # Allow trunk's CDN a moment to index the just-pushed core version, then
          # publish the companion against it.
          pod repo update
          if published SetgreetSDKLottie; then
            echo "SetgreetSDKLottie ${VERSION} already on trunk, skipping"
          else
            pod trunk push SetgreetSDKLottie.podspec --allow-warnings --synchronous
          fi
